server {
  listen 80;
  server_name app.h9y.ai;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The entry document names the hashed bundles, so a cached copy of it pins the
  # browser to a build that no longer exists on disk — every asset it asks for
  # 404s, or worse, still resolves from the browser's own six-month cache and the
  # user keeps running last week's app. It must be revalidated on every load.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|json|txt|md)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
