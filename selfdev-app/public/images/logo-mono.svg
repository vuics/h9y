<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="none" />
  
  <!-- Central hub - octopus head with gradient -->
  <defs>
    <radialGradient id="headGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#2c3e50" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="160" r="65" fill="url(#headGradient)" />
  
  <!-- Octopus eyes - friendly and expressive -->
  <circle cx="175" cy="145" r="14" fill="#f0f6fc" />
  <circle cx="225" cy="145" r="14" fill="#f0f6fc" />
  <circle cx="175" cy="145" r="7" fill="#2c3e50"/>
  <circle cx="225" cy="145" r="7" fill="#2c3e50"/>
  
  <!-- Eye highlights for friendly look -->
  <circle cx="172" cy="142" r="3" fill="#f0f6fc" opacity="0.9"/>
  <circle cx="222" cy="142" r="3" fill="#f0f6fc" opacity="0.9"/>
  
  <!-- Friendly smile -->
  <path d="M175,170 Q200,190 225,170" fill="none" stroke="#f0f6fc" stroke-width="5" stroke-linecap="round" />
  
  <!-- Rosy cheeks for extra friendliness -->
  
  
  
  <!-- Tentacles (each representing different aspects of the platform) -->
  <!-- Tentacle 1 - Memory -->
  <path d="M165,205 C140,230 110,245 80,240" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="80" cy="240" r="22" fill="#2c3e50" />
  
  <!-- Memory -->
  <g transform="translate(80, 240)">
    <ellipse cx="0" cy="-8" rx="10" ry="3.6" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><path d="M-10,-8 L-10,7" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><path d="M10,-8 L10,7" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><path d="M-10,7 A 10,3.6 0 0 0 10,7" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><path d="M-10,-0.6 A 10,3.6 0 0 0 10,-0.6" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  </g>
  
  <!-- Tentacle 2 - Evolution -->
  <path d="M185,220 C180,260 170,295 150,325" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="150" cy="325" r="22" fill="#2c3e50" />
  
  <!-- Evolution -->
  <g transform="translate(150, 325)">
    <path d="M-11,7 L-4,-0.5 L0.5,4 L9,-7" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><path d="M3.6,-7 L9,-7 L9,-1.6" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/>
  </g>
  
  <!-- Tentacle 3 - Coordination -->
  <path d="M215,220 C220,260 230,295 250,325" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="250" cy="325" r="22" fill="#2c3e50" />
  
  <!-- Coordination -->
  <g transform="translate(250, 325)">
    <path d="M0,-8 L-8.5,6.5 M0,-8 L8.5,6.5 M-8.5,6.5 L8.5,6.5" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><circle cx="0" cy="-8" r="3.4" fill="#f0f6fc"/><circle cx="-8.5" cy="6.5" r="3.4" fill="#f0f6fc"/><circle cx="8.5" cy="6.5" r="3.4" fill="#f0f6fc"/>
  </g>
  
  <!-- Tentacle 4 - Authority & Guardrails -->
  <path d="M235,205 C260,230 290,245 320,240" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="320" cy="240" r="22" fill="#2c3e50" />
  
  <!-- Authority & Guardrails -->
  <g transform="translate(320, 240)">
    <path d="M0,-10.5 L9.5,-6.8 C9.5,1.2 5.4,7.8 0,10.5 C-5.4,7.8 -9.5,1.2 -9.5,-6.8 Z" fill="#f0f6fc"/><path d="M-4.2,-0.6 L-1.2,2.6 L4.4,-3.6" stroke="#2c3e50" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Tentacle 5 - Human in the Loop -->
  <path d="M160,180 C115,170 85,150 70,110" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="70" cy="110" r="22" fill="#2c3e50" />
  
  <!-- Human in the Loop -->
  <g transform="translate(70, 110)">
    <circle cx="-6.5" cy="-5.6" r="3.5" fill="#f0f6fc"/><path d="M-12,7 C-12,1.8 -9.6,-0.6 -6.5,-0.6 C-3.4,-0.6 -1,1.8 -1,7 Z" fill="#f0f6fc"/><rect x="2.2" y="-9.8" width="9.2" height="8" rx="2.3" fill="#f0f6fc"/><circle cx="4.9" cy="-5.9" r="1.2" fill="#2c3e50"/><circle cx="8.4" cy="-5.9" r="1.2" fill="#2c3e50"/><path d="M1,7 C1,2.4 3.4,0.4 6.5,0.4 C9.6,0.4 12,2.4 12,7 Z" fill="#f0f6fc"/>
  </g>
  
  <!-- Tentacle 6 - Agents as Entities -->
  <path d="M200,100 C200,70 200,50 200,20" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="200" cy="20" r="22" fill="#2c3e50" />
  
  <!-- Agents as Entities -->
  <g transform="translate(200, 20)">
    <circle cx="0" cy="-13.4" r="1.8" fill="#f0f6fc"/><path d="M0,-11.8 L0,-9.6" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round"/><rect x="-8.6" y="-9.6" width="17.2" height="13" rx="4.2" fill="#f0f6fc"/><circle cx="-3.4" cy="-3.2" r="1.9" fill="#2c3e50"/><circle cx="3.4" cy="-3.2" r="1.9" fill="#2c3e50"/><path d="M-9.8,11.4 C-9.8,6.6 -5.4,4.6 0,4.6 C5.4,4.6 9.8,6.6 9.8,11.4 Z" fill="#f0f6fc"/>
  </g>
  
  <!-- Tentacle 7 - Intent & Goals -->
  <path d="M240,180 C285,170 315,150 330,110" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="330" cy="110" r="22" fill="#2c3e50" />
  
  <!-- Intent & Goals -->
  <g transform="translate(330, 110)">
    <circle cx="0" cy="0" r="10" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><circle cx="0" cy="0" r="5" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><circle cx="0" cy="0" r="1.9" fill="#f0f6fc"/>
  </g>
  
  <!-- Tentacle 8 - Observability -->
  <path d="M210,225 C220,250 245,275 285,285" fill="none" stroke="#2c3e50" stroke-width="14" stroke-linecap="round"/>
  <circle cx="285" cy="285" r="22" fill="#2c3e50" />
  
  <!-- Observability -->
  <g transform="translate(285, 285)">
    <rect x="-10.5" y="-8.6" width="21" height="17.2" rx="3.2" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3"/><path d="M-6,1.6 L-2.6,-3.6 L0.6,2.4 L4,-4.6 L6.4,0.4" stroke="#f0f6fc" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
  </g>
  
  <!-- Data pulse effects on each endpoint -->
  <g>
    <circle cx="80" cy="240" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="150" cy="325" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="250" cy="325" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="320" cy="240" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="70" cy="110" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="200" cy="20" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="330" cy="110" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="285" cy="285" r="27" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  
  
  <!-- Center pulse -->
  <circle cx="200" cy="160" r="70" stroke="#2c3e50" stroke-width="3" fill="none" opacity="0.5"/>
</svg>