<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldPlate" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%"   stop-color="#2c3f52"/>
      <stop offset="38%"  stop-color="#22303f"/>
      <stop offset="72%"  stop-color="#1b2733"/>
      <stop offset="100%" stop-color="#131c25"/>
    </linearGradient>
    <radialGradient id="headGradient" cx="50%" cy="36%" r="64%">
      <stop offset="0%"   stop-color="#f0dda6"/>
      <stop offset="62%"  stop-color="#dcbe78"/>
      <stop offset="100%" stop-color="#c19a4b"/>
    </radialGradient>
    <linearGradient id="tubeLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* signal running along each conductor, from the octopus out to the contact pad */
    @keyframes h9y-signal { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    .h9y-sig { fill: none; stroke: #ffffff; stroke-opacity: .85; stroke-width: 7;
               stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 91;
               animation: h9y-signal 2.8s linear infinite; }

    /* flash when the signal reaches the pad */
    @keyframes h9y-ping { 0% { transform: scale(1); opacity: .6; } 70%, 100% { transform: scale(1.8); opacity: 0; } }
    .h9y-ping { fill: none; stroke-width: 2.5; transform-box: fill-box; transform-origin: center;
                animation: h9y-ping 2.8s ease-out infinite; }

    /* slow breathing ring around the central circle */
    @keyframes h9y-breathe { 0% { transform: scale(1); opacity: .4; } 100% { transform: scale(1.22); opacity: 0; } }
    .h9y-breathe { fill: none; stroke: #d9bd7c; stroke-width: 3; transform-box: fill-box;
                   transform-origin: center; animation: h9y-breathe 3.4s ease-out infinite; }

    /* blink */
    @keyframes h9y-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    .h9y-eye { transform-box: fill-box; transform-origin: center;
               animation: h9y-blink 5.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .h9y-sig, .h9y-ping, .h9y-breathe { animation: none; opacity: 0; }
      .h9y-eye { animation: none; }
    }
  </style>


  <!-- ===== CHIP PLATE ===== -->
  <rect x="34" y="50" width="332" height="300" rx="38"
        fill="url(#goldPlate)" stroke="#0e161e" stroke-width="9"/>

  <!-- ===== CONDUCTOR BEDS (dark chip traces) ===== -->
  <g id="traces" fill="none" stroke="#0e161e" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200,138 L200,80"/>
    <path d="M200,262 L200,320"/>
    <path d="M142,200 L63,200"/>
    <path d="M258,200 L337,200"/>
    <path d="M159,159 L123,123 Q117,117 107,117 L62,117"/>
    <path d="M241,159 L277,123 Q283,117 293,117 L338,117"/>
    <path d="M159,241 L123,277 Q117,283 107,283 L62,283"/>
    <path d="M241,241 L277,277 Q283,283 293,283 L338,283"/>
  </g>

  <!-- ===== TENTACLES INSCRIBED IN THE CONDUCTORS ===== -->
  <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200,138 L200,80"   stroke="#d9bd7c"/>
    <path d="M200,262 L200,320"  stroke="#d9bd7c"/>
    <path d="M142,200 L63,200"   stroke="#d9bd7c"/>
    <path d="M258,200 L337,200"  stroke="#d9bd7c"/>
    <path d="M159,159 L123,123 Q117,117 107,117 L62,117" stroke="#d9bd7c"/>
    <path d="M241,159 L277,123 Q283,117 293,117 L338,117" stroke="#d9bd7c"/>
    <path d="M159,241 L123,277 Q117,283 107,283 L62,283" stroke="#d9bd7c"/>
    <path d="M241,241 L277,277 Q283,283 293,283 L338,283" stroke="#d9bd7c"/>
  </g>
  <!-- tube highlight -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M195,134 L195,82"/>
    <path d="M195,266 L195,318"/>
    <path d="M146,195 L64,195"/>
    <path d="M262,195 L336,195"/>
    <path d="M156,156 L120,120 Q113,113 103,113 L68,113"/>
    <path d="M244,156 L280,120 Q287,113 297,113 L332,113"/>
    <path d="M155,238 L119,274 Q114,278 104,278 L68,278"/>
    <path d="M245,238 L281,274 Q286,278 296,278 L332,278"/>
  </g>

  <g>
    <path class="h9y-sig" pathLength="100" style="animation-delay:0.00s" d="M200,138 L200,80"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:0.35s" d="M200,262 L200,320"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:0.70s" d="M142,200 L63,200"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:1.05s" d="M258,200 L337,200"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:1.40s" d="M159,159 L123,123 Q117,117 107,117 L62,117"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:1.75s" d="M241,159 L277,123 Q283,117 293,117 L338,117"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:2.10s" d="M159,241 L123,277 Q117,283 107,283 L62,283"/>
    <path class="h9y-sig" pathLength="100" style="animation-delay:2.45s" d="M241,241 L277,277 Q283,283 293,283 L338,283"/>
  </g>

  <!-- ===== CENTRAL CHIP CIRCLE ===== -->
  <circle cx="200" cy="200" r="68" fill="url(#goldPlate)" stroke="#0e161e" stroke-width="9"/>

  <g>
    <circle class="h9y-ping" cx="200" cy="80" r="20" stroke="#d9bd7c" style="animation-delay:2.55s"/>
    <circle class="h9y-ping" cx="200" cy="320" r="20" stroke="#d9bd7c" style="animation-delay:2.90s"/>
    <circle class="h9y-ping" cx="63" cy="200" r="20" stroke="#d9bd7c" style="animation-delay:3.25s"/>
    <circle class="h9y-ping" cx="337" cy="200" r="20" stroke="#d9bd7c" style="animation-delay:3.60s"/>
    <circle class="h9y-ping" cx="63" cy="117" r="20" stroke="#d9bd7c" style="animation-delay:3.95s"/>
    <circle class="h9y-ping" cx="337" cy="117" r="20" stroke="#d9bd7c" style="animation-delay:4.30s"/>
    <circle class="h9y-ping" cx="63" cy="283" r="20" stroke="#d9bd7c" style="animation-delay:4.65s"/>
    <circle class="h9y-ping" cx="337" cy="283" r="20" stroke="#d9bd7c" style="animation-delay:5.00s"/>
    <circle class="h9y-breathe" cx="200" cy="200" r="72"/>
  </g>

  <!-- ===== CONTACT PADS (tentacle tips) ===== -->
  <g stroke="#0e161e" stroke-width="5">
    <circle cx="200" cy="80"  r="20" fill="#d9bd7c"/>
    <circle cx="200" cy="320" r="20" fill="#d9bd7c"/>
    <circle cx="63"  cy="200" r="20" fill="#d9bd7c"/>
    <circle cx="337" cy="200" r="20" fill="#d9bd7c"/>
    <circle cx="63"  cy="117" r="20" fill="#d9bd7c"/>
    <circle cx="337" cy="117" r="20" fill="#d9bd7c"/>
    <circle cx="63"  cy="283" r="20" fill="#d9bd7c"/>
    <circle cx="337" cy="283" r="20" fill="#d9bd7c"/>
  </g>


  <!-- ===== OCTOPUS HEAD INSCRIBED IN THE CHIP CIRCLE ===== -->
  <circle cx="200" cy="200" r="55" fill="url(#headGradient)" stroke="#0e161e" stroke-width="3"/>
  <circle cx="200" cy="192" r="44" fill="url(#tubeLight)"/>

  <g class="h9y-eye">
    <circle cx="177" cy="188" r="12.5" fill="#1b2733"/>
    <circle cx="177" cy="189" r="6.3"  fill="#1b2733"/>
    <circle cx="174.4" cy="185" r="2.7"  fill="#1b2733" opacity="0.95"/>
  </g>
  <g class="h9y-eye">
    <circle cx="223" cy="188" r="12.5" fill="#1b2733"/>
    <circle cx="223" cy="189" r="6.3"  fill="#1b2733"/>
    <circle cx="220.4" cy="185" r="2.7"  fill="#1b2733" opacity="0.95"/>
  </g>

  <path d="M179,209 Q200,226 221,209" fill="none" stroke="#1b2733" stroke-width="5" stroke-linecap="round"/>

  
</svg>
